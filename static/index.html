<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro12AI — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/css/mini-app.css">
</head>
<body>
<div class="container">
  <header class="header">
    <h1>🔮 Таро Школы «12 Планет»</h1>
    <p class="subtitle" id="subtitle">Выберите расклад</p>
  </header>

  <!-- ЭКРАН 1: расклад (кнопки «назад» НЕТ) -->
  <section id="screen-spread" class="section">
    <h2>Выберите тип расклада</h2>
    <div class="button-grid">
      <button class="btn-primary" data-spread="one">🃏 Одна карта</button>
      <button class="btn-primary" data-spread="three">🔮 Три карты</button>
      <button class="btn-primary" data-spread="choice">⚖️ Выбор пути</button>
      <button class="btn-primary" data-spread="celtic">✝️ Кельтский крест</button>
    </div>
    <button class="btn-secondary" id="btn-astro">🪐 Астрология: параметр аспекта</button>
  </section>

  <!-- ЭКРАН 2: колода -->
  <section id="screen-deck" class="section hidden">
    <h2>Выберите колоду</h2>
    <div id="deck-list" class="deck-list"></div>
    <button class="btn-secondary" data-back="spread">← Назад к раскладам</button>
  </section>

  <!-- ЭКРАН 3: перемешать / вытянуть -->
  <section id="screen-shuffle" class="section hidden">
    <h2 id="shuffle-title">Перемешайте колоду</h2>
    <div class="card-deck-visual"><div class="card-back" id="deck-visual"></div></div>
    <button class="btn-primary btn-large" id="btn-shuffle">🔀 Перемешать</button>
    <button class="btn-primary btn-large hidden" id="btn-draw">✨ Вытянуть карты</button>
    <button class="btn-secondary" data-back="deck">← Назад к колодам</button>
  </section>

  <!-- ЭКРАН 4: результат -->
  <section id="screen-result" class="section hidden">
    <h2>Ваши карты</h2>
    <div id="cards-result" class="cards-result"></div>
    <button class="btn-success btn-large" id="btn-send">✅ Отправить в бот</button>
    <button class="btn-secondary" data-back="shuffle">🔄 Повторить расклад</button>
  </section>

  <!-- ЭКРАН 5: астрология -->
  <section id="screen-astro" class="section hidden">
    <h2>🪐 Параметр аспекта</h2>
    <form id="astro-form" class="deck-list">
      <select id="planet1" required></select>
      <select id="sign1" required></select>
      <select id="aspect" required></select>
      <select id="planet2" required></select>
      <select id="sign2" required></select>
      <button class="btn-success" type="submit">✅ Отправить в бот</button>
      <button class="btn-secondary" type="button" data-back="spread">← Назад</button>
    </form>
  </section>
</div>
<script src="/static/js/mini-app.js"></script>
</body>
</html>
