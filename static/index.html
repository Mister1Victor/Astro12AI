<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Таро «12 Планет»</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/css/mini-app.css">
  <style>
    /* Индикатор загрузки (свой, т.к. в Telegram нет showLoading) */
    .loading-overlay{position:fixed;inset:0;background:rgba(15,15,19,.85);display:flex;
      flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
    .spinner{width:44px;height:44px;border:4px solid rgba(212,175,55,.25);
      border-top-color:#d4af37;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{color:#eaeaea;font-size:14px}
    .hidden{display:none!important}
  </style>
</head>
<body>
<div class="app-container">

  <header class="app-header">
    <h1>🔮 Таро «12 Планет»</h1>
    <p class="subtitle">Выберите расклад и вытяните карты</p>
  </header>

  <!-- Индикатор загрузки -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Загрузка…</div>
  </div>

  <!-- 1. Выбор расклада -->
  <section id="screen-spread-type" class="screen active">
    <h2 class="screen-title">Выберите тип расклада</h2>
    <div class="options-grid">
      <button class="option-card spread-option" data-spread="one">🃏 Одна карта</button>
      <button class="option-card spread-option" data-spread="three">🔮 Три карты</button>
      <button class="option-card spread-option" data-spread="celtic">✝️ Кельтский крест</button>
      <button class="option-card spread-option" data-spread="choice">⚖️ Выбор пути</button>
      <button class="option-card spread-option" data-spread="yesno">🎯 Да или Нет</button>
    </div>
    <button class="btn-secondary astro-btn" id="astro-open-btn">🪐 Астрология: параметр аспекта</button>
    <div class="nav-bottom">
      <button class="btn-text home-btn">🏠 Основное меню</button>
    </div>
  </section>

  <!-- 2. Подтип «Три карты» -->
  <section id="screen-three-type" class="screen">
    <h2 class="screen-title">Тип расклада «Три карты»</h2>
    <div class="options-list">
      <button class="option-row three-type-option" data-three="past-present-future">🕐 Прошлое — Настоящее — Будущее</button>
      <button class="option-row three-type-option" data-three="thoughts-feelings-actions">💭 Мысли — Чувства — Действия</button>
      <button class="option-row three-type-option" data-three="plus-minus-result">➕➖ Плюс — Минус — Итог</button>
    </div>
    <div class="nav-bottom">
      <button class="btn-secondary back-btn">🔙 Назад</button>
      <button class="btn-text home-btn">🏠 Основное меню</button>
    </div>
  </section>

  <!-- 3. Выбор колоды -->
  <section id="screen-deck" class="screen">
    <h2 class="screen-title">Выберите колоду</h2>
    <div class="options-list" id="deck-list"></div>
    <div class="nav-bottom">
      <button class="btn-secondary back-btn">🔙 Назад</button>
      <button class="btn-text home-btn">🏠 Основное меню</button>
    </div>
  </section>

  <!-- 4. Перевёрнутые карты -->
  <section id="screen-reverse" class="screen">
    <h2 class="screen-title">Настройка карт</h2>
    <p class="description">Использовать ли перевёрнутые карты в раскладах?</p>
    <div class="options-list">
      <button class="option-row reverse-option" data-reversed="yes">✅ Да, использовать перевёрнутые</button>
      <button class="option-row reverse-option" data-reversed="no">❌ Нет, только прямые</button>
    </div>
    <div class="nav-bottom">
      <button class="btn-secondary back-btn">🔙 Назад</button>
      <button class="btn-text home-btn">🏠 Основное меню</button>
    </div>
  </section>

  <!-- 5. Вопрос -->
  <section id="screen-question" class="screen">
    <h2 class="screen-title">Ваш вопрос</h2>
    <div class="input-group">
      <textarea id="question-input" rows="4" placeholder="Напишите вопрос, на который должен ответить расклад…"></textarea>
    </div>
    <button class="btn-primary" id="question-submit-btn">Продолжить →</button>
    <div class="nav-bottom">
      <button class="btn-secondary back-btn">🔙 Назад</button>
      <button class="btn-text home-btn">🏠 Основное меню</button>
    </div>
  </section>

  <!-- 6. Перемешивание / вытягивание -->
  <section id="screen-shuffle" class="screen">
    <h2 class="screen-title" id="shuffle-title">Перемешайте колоду</h2>
    <div class="shuffle-visual">
      <div class="card-stack" id="card-stack">
        <div class="card-back offset-1"></div>
        <div class="card-back offset-2"></div>
        <div class="card-back"></div>
      </div>
    </div>
    <button class="btn-primary" id="shuffle-btn">🔀 Перемешать</button>
    <button class="btn-primary hidden" id="draw-btn">✨ Вытянуть карты</button>
    <div class="nav-bottom">
      <button class="btn-secondary back-btn">🔙 Назад</button>
      <button class="btn-text home-btn">🏠 Основное меню</button>
    </div>
  </section>

  <!-- 7. Результат -->
  <section id="screen-result" class="screen">
    <h2 class="screen-title">Ваши карты</h2>
    <div class="cards-display" id="result-cards"></div>
    <button class="btn-primary" id="interpret-btn">🔮 Получить толкование</button>
    <button class="btn-secondary" id="redraw-btn">🔄 Повторить расклад</button>
    <div class="nav-bottom">
      <button class="btn-secondary back-btn">🔙 Назад</button>
      <button class="btn-text home-btn">🏠 Основное меню</button>
    </div>
  </section>

  <!-- 8. Толкование -->
  <section id="screen-interpretation" class="screen">
    <h2 class="screen-title">Толкование расклада</h2>
    <div class="interpretation-box" id="interpretation-box">
      <div class="interpretation-text" id="interpretation-text"></div>
    </div>
    <button class="btn-secondary" id="back-to-cards-btn">🔙 К картам</button>
    <button class="btn-secondary" id="send-to-bot-btn">📨 Отправить в бот</button>
    <div class="nav-bottom">
      <button class="btn-secondary back-btn">🔙 Назад</button>
      <button class="btn-text home-btn">🏠 Основное меню</button>
    </div>
  </section>

  <!-- 9. Астрология -->
  <section id="screen-astro" class="screen">
    <h2 class="screen-title">🪐 Параметр аспекта</h2>
    <form id="astro-form">
      <div class="form-group">
        <label for="planet1">Первая планета</label>
        <select id="planet1" required></select>
      </div>
      <div class="form-group">
        <label for="sign1">Знак первой планеты</label>
        <select id="sign1" required></select>
      </div>
      <div class="form-group">
        <label for="aspect-type">Тип аспекта</label>
        <select id="aspect-type" required></select>
      </div>
      <div class="form-group">
        <label for="planet2">Вторая планета</label>
        <select id="planet2" required></select>
      </div>
      <div class="form-group">
        <label for="sign2">Знак второй планеты</label>
        <select id="sign2" required></select>
      </div>
      <button type="submit" class="btn-primary">✅ Отправить в бот</button>
    </form>
    <div class="nav-bottom">
      <button class="btn-secondary back-btn">🔙 Назад</button>
      <button class="btn-text home-btn">🏠 Основное меню</button>
    </div>
  </section>

</div>
<script src="/static/js/mini-app.js"></script>
</body>
</html>
